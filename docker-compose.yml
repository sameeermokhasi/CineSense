version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Container
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: cinesense_postgres
    restart: always
    environment:
      POSTGRES_DB: cinesense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinesense"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis Cache Container
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: cinesense_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Web Database Table Viewer (Adminer)
  # ==========================================
  db_viewer:
    image: adminer:latest
    container_name: cinesense_db_viewer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 4. CineSense FastAPI Backend Container
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinesense_backend
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cinesense
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
